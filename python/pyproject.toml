[project]
name = "fold"
version = "0.1.0"
description = "A notification service for alerting users when laundry is done and ready to be...folded."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"

[tool.poetry]
requires-python = ">=3.11"
dependencies = [
    "numpy (>=2.3.3,<3.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "ipympl (>=0.9.7,<0.10.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
]
packages = [
    { include = "fold", from = "src" }
]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
